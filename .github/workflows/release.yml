name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./apps/dcache/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/dcache/package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Lint, typecheck, test
        run: bunx nx run-many -t lint typecheck test

      - name: Bundle
        run: bunx nx run dcache:bundle

      - name: Publish to npm
        run: |
          cp apps/dcache/package.json dist/apps/dcache/package.json
          cp apps/dcache/README.md dist/apps/dcache/README.md
          cd dist/apps/dcache && npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
